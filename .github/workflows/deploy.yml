name: Deploy Multi-Sport Tracker to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # FIXED: Targets placeholders cleanly by evaluating standard replacement handles
      - name: Inject Production Secrets Inline
        env:
          PROD_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          sed -i 's|__PROD_URL__|'"$PROD_URL"'|g' index.html
          sed -i 's|__PROD_KEY__|'"$PROD_KEY"'|g' index.html

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Deployment Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publish Live to GitHub Pages Server
        id: deployment
        uses: actions/deploy-pages@v4