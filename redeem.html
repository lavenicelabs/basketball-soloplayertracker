<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaVenice Labs | Redemption Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; width: 100%; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; font-size: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Redeem Access</h1>
    <p>Enter your Etsy order number below to receive your license key.</p>
    <input type="text" id="orderNumber" placeholder="e.g., 1234567890">
    <button onclick="redeemKey()">Get License Key</button>
    <div id="result"></div>
</div>

<script>
    // Replace with your actual project credentials
    const sbClient = supabase.createClient('https://upgfhekhifolcqiudhzy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwZ2ZoZWtoaWZvbGNxaXVkaHp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc4ODksImV4cCI6MjA5Nzk5Mzg4OX0.OIU2FU4ThR41pTK571BpL0wJS6zBqtI0B0Pth851le4');

	async function redeemKey() {
		const orderNum = document.getElementById('orderNumber').value;
		const resDiv = document.getElementById('result');
		
		console.log("Starting redemption for:", orderNum); // You'll see this in the console
		
		resDiv.style.display = 'block';
		resDiv.innerText = "Processing...";

		try {
			const { data, error } = await sbClient.rpc('redeem_order', { 
				input_order_number: orderNum 
			});

			if (error) {
				console.error("Supabase Error:", error);
				resDiv.innerText = "Error: " + error.message;
			} else {
				console.log("Success:", data);
				resDiv.innerHTML = "Success! Your Key: " + data;
			}
		} catch (err) {
			console.error("Fetch Error:", err);
			resDiv.innerText = "Something went wrong. Check console.";
		}
	}
</script>

</body>
</html>
